name: Contract and offline verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Contracts and offline regressions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build contracts
        run: npm run build

      - name: Smoke test emitted JavaScript
        run: npm run test:built

      - name: Test emitted consumers
        run: npm run test:consumers

      - name: Run contract tests
        run: npm test

      - name: Test isolated B0 prototype
        run: npm run test:b0

      - name: Test offline AI and student client boundaries
        run: node --test tests/ai/*.test.mjs tests/critical/persistent-api-*.test.mjs

      - name: Test documentation checker regressions
        run: npm run test:docs

      - name: Verify generated OpenAPI artifact
        run: npm run contracts:check

      - name: Verify student consumer import boundary
        run: npm run contracts:consumer-check

      - name: Verify documentation
        run: npm run docs:check

      - name: Check whitespace errors
        run: git diff --check
