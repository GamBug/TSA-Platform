# One extra site for the shared nginx. Installed as /etc/nginx/sites-available/tsa.smartnovi.tech
# and enabled by symlink. Certbot (`certbot --nginx -d tsa.smartnovi.tech`) adds the TLS server block
# and the http-to-https redirect to this file. Other sites are not touched.
server {
    listen 80;
    listen [::]:80;
    # The sslip.io name resolves to the server by itself and is used until the smartnovi.tech record exists.
    server_name tsa.smartnovi.tech tsa.103.72.56.139.sslip.io;

    client_max_body_size 1m;

    # The bare link opens the student app. Everything else, including every other unknown path, reaches the app.
    location = / {
        return 302 /student/;
    }

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        # The app pins Host and Origin to the public origin and reads the last X-Forwarded-For entry
        # (the address nginx saw), so keep the client's own header and let nginx append to it.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
